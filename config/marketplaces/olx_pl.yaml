# OLX.pl — phone-broker channel (TZ Marketplaces).
# The broker is the SINGLE source of truth for the app package
# (pl.tablica) and the rate limits. Fingerprints are captured
# during Phase 1 (search via phone) and are version-tied.
key: olx_pl
title: OLX
country: PL
currency: PLN
access_mode: ANDROID
base_url: "https://www.olx.pl"
auth:
  type: none
  secret_ref: ""
capabilities:
  search: true
  post: false
  edit: false
  archive: false
  messaging: false
  max_photos: 20
  max_title_len: 80
  max_body_len: 5000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
  payment_options:
    - cash
    - bank_transfer
# Search channel: web connector (OlxConnector) via the search page
# /oferty/q-{query}/, parsing the embedded __PRERENDERED_STATE__ JSON
# (TZ-connectors-add-4). Transport: curl_cffi chrome (plain httpx 403s).
# access_mode stays ANDROID (phone-broker channel config); the web connector
# is the working search channel (Vinted pattern).
routes:
  search: "/oferty/q-{query}/"
selectors: {}
rate_limits:
  requests_per_minute: 0
  min_delay_seconds: 0
android:
  platform_id: olx_pl
  fingerprints: []
media:
  max_photos: null
  min_width: null
  min_height: null
  max_width: null
  max_height: null
  aspect_preferred: null
  max_file_bytes: null
  formats: []
  source_url: null
  verified_at: null
