# Willhaben.at — phone-broker channel (TZ Marketplaces).
# The broker is the SINGLE source of truth for the app package
# (at.willhaben) and the rate limits. Fingerprints are captured
# during Phase 1 (search via phone) and are version-tied.
key: willhaben_at
title: Willhaben
country: AT
lang: de
currency: EUR
access_mode: ANDROID
base_url: "https://www.willhaben.at"
auth:
  type: none
  secret_ref: ""
capabilities:
  search: true
  post: false
  edit: false
  archive: false
  messaging: false
  max_photos: 20
  max_title_len: 70
  max_body_len: 5000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
  payment_options:
    - cash
    - bank_transfer
# Search channel: web connector (WillhabenConnector) via the category search
# page /iad/kaufen-und-verkaufen/marktplatz/?keyword={query}, parsing the
# embedded __NEXT_DATA__ JSON (TZ-connectors-add-4). Plain httpx returns 200.
# access_mode stays ANDROID (phone-broker channel config); the web connector
# is the working search channel (Vinted pattern).
routes:
  search: "/iad/kaufen-und-verkaufen/marktplatz/"
  search_params:
    query: "keyword"
selectors: {}
rate_limits:
  requests_per_minute: 0
  min_delay_seconds: 0
android:
  platform_id: willhaben_at
  search:
    search_field: "at.willhaben:id/search_entry_bar"
    result_card: "content-desc:€"
    share_button: ""
    copy_button: ""
    domain: "willhaben.at"
  fingerprints: []
media:
  max_photos: null
  min_width: null
  min_height: null
  max_width: null
  max_height: null
  aspect_preferred: null
  max_file_bytes: null
  formats: []
  source_url: null
  verified_at: null
