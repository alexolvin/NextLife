key: trhknih_cz
title: TrhKnih.cz
country: CZ
currency: CZK
access_mode: DIRECT
base_url: "https://www.trhknih.cz"
# D.1 daily canary: harmless query. The site is a bookstore, so the canary
# uses a stable book query («python»: 36 results on 2026-10-03, 10 rows on
# the first page on 2026-10-04); «notebook» (laptop) is meaningless here.
canary_query: "python"
auth:
  type: none
  secret_ref: ""
capabilities:
  search: true
  post: true
  edit: true
  archive: true
  relist: true
  category_auto_detect: true
  has_delivery_fields: false
  messaging: false
  max_photos: 5
  max_title_len: 255
  max_body_len: 4000
  allows_generative_photos: false
  delivery_options:
    - post
    - pickup
  payment_options:
    - cash
    - bank_transfer
    - cod
category_tree:
  - top: "beletrie"
    label: "Beletrie"
    subs:
      - "Romány"
      - "Detektivky a krimi"
      - "Sci-fi a fantasy"
      - "Thrillery a horory"
      - "Historické romány"
      - "Poezie"
      - "Komiksy a manga"
  - top: "odborna"
    label: "Odborná literatura"
    subs:
      - "Počítače a IT"
      - "Přírodní vědy"
      - "Společenské vědy"
      - "Ekonomie a finance"
      - "Historie a dějiny"
      - "Psychologie a osobní rozvoj"
      - "Medicína a zdraví"
      - "Právo"
  - top: "ucebnice"
    label: "Učebnice a vzdělávání"
    subs:
      - "Základní školy"
      - "Střední školy"
      - "Vysoké školy"
      - "Jazykové učebnice"
      - "Slovníky a encyklopedie"
  - top: "detske"
    label: "Dětská literatura"
    subs:
      - "Pohádky"
      - "Pro nejmenší a leporela"
      - "Mládež a young adult"
      - "Naučná pro děti"
  - top: "hobby"
    label: "Záliby a hobby"
    subs:
      - "Kuchařky a gastronomie"
      - "Cestování a průvodci"
      - "Zahrada a kutilství"
      - "Umění a architektura"
      - "Sport a fitness"
      - "Motorismus"
  - top: "cizojazycne"
    label: "Cizojazyčné knihy"
    subs:
      - "Anglické knihy"
      - "Německé knihy"
      - "Francouzské knihy"
      - "Jiné jazyky"
  - top: "antikvariat"
    label: "Antikvariát a sběratelství"
    subs:
      - "Staré tisky a bibliofilie"
      - "Historické mapy a atlasy"
      - "Časopisy a periodika"
# TZ M1 A.5: ограничение по категории в реестре площадки — только лоты
# категории «книги»; лот другой категории на эту площадку не предлагается
# (проверяется тестом + мутация D.3-8).
allowed_categories:
  - books
filter_reason: "TrhKnih.cz принимает исключительно книги: «Na webových stránkách www.trhknih.cz je umístěno internetové tržiště, prostřednictvím kterého mohou jeho uživatelé nakupovat a prodávat knihy. Kniha znamená knihu v listinné originální podobě» (Obchodní podmínky čl. 1.2). Видеокарта в очередь публикации не ставится."
rules_evidence: "evidence/trhknih_cz/rules/obchodni_podminky.html"
selectors:
  # Live markup 2026-10-04 (.a/reports/m1/probes/2026-10-04/
  # trhknih_cz_search_python.html): 10 rows .serp-item; цена «639 Kč» в
  # span.ask-count; строки-теги (без стикера) исключаются базовым парсером.
  # Дат публикации на карточках НЕТ (только год издания в <em>) —
  # Ч-1: posted_at остаётся None.
  search_result: ".serp-item"
  price: ".ask-count"
  title: "p a"
routes:
  # Live-verified 2026-10-04: GET /hledat?q=... (ценового фильтра на
  # странице выдачи нет — параметры цены не заявляем, Ч-6).
  search: "/hledat"
  search_params:
    query: "q"
mapping: {}
rate_limits:
  requests_per_minute: 20
  min_delay_seconds: 2

media:
  max_photos: null
  min_width: null
  min_height: null
  max_width: null
  max_height: null
  aspect_preferred: null
  max_file_bytes: null
  formats: []
  source_url: null
  verified_at: null
