key: bazos_cz
title: Bazoš.cz
country: CZ
currency: CZK
access_mode: DIRECT
base_url: "https://www.bazos.cz"
# D.1 daily canary: harmless query.
canary_query: "notebook"
# Search is no-auth (HTML). Publish (wizard stage 2/3, NOT built yet) requires
# the owner's Bazoš account + phone (SMS confirmation) — the "place" for the
# credential is below; the value is resolved from .env via resolve_secret.
auth:
  type: none
  secret_ref: "BAZOS_CZ_ACCOUNT_EMAIL"
capabilities:
  search: true
  # Публикация реализована (2026-10-24, bazos_publish.py): DIRECT web + SMS
  # (human-in-the-loop). Dry-run в коннекторе; live — через bazos_publish.py.
  post: true
  edit: false
  archive: true
  relist: true
  messaging: false
  max_photos: 10
  max_title_len: 60
  max_body_len: 4000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
    - cpost
  payment_options:
    - cash
    - bank_transfer
    - cod
selectors:
  search_result: ".inzeraty"
  price: ".inzeratycena"
  # Card date, e.g. '- [4.10. 2026]' (live probe 2026-10-03).
  date: "span.velikost10"
routes:
  # Route verified live 2026-10-03 (.a/reports/m1/probes/2026-10-03/bazos_cz.html).
  search: "/search.php"
  search_params:
    query: "hledat"
    min_price: "cenada"
    max_price: "cenado"
    zip_code: "hlokalita"
  # Publish flow (bazos_publish.py): login page + listing form + recon.
  # publish_form uses {top} placeholder — replaced with the category subdomain.
  publish_login: "/moje-inzeraty.php"
  publish_form: "https://{top}.bazos.cz/pridat-inzerat.php"
  publish_recon: "https://{top}.bazos.cz/"
  publish_recon_direct: "https://{top}.bazos.cz/vlozit-inzerat.php"
