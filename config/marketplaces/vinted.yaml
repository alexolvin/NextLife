key: vinted
title: Vinted
country: CZ
currency: CZK
access_mode: ANDROID
publish_channel: web
base_url: https://www.vinted.cz
auth:
  type: none
  secret_ref: ''
capabilities:
  search: true
  post: true
  edit: true
  archive: true
  relist: true
  messaging: false
  max_photos: 20
  max_title_len: 80
  max_body_len: 5000
  allows_generative_photos: false
  has_delivery_fields: true
  delivery_options:
  - pickup
  - post
  - zasilkovna
  payment_options:
  - cash
  - bank_transfer
  category_auto_detect: true
selectors: {}
rate_limits:
  requests_per_minute: 0
  min_delay_seconds: 0
android:
  platform_id: vinted
  search:
    search_field: input_search
    consent_selector: text=Přijmout vše
    result_card: item_box_container
    share_menu: resource-id=vinted_toolbar_submenu_item
    share_action: text=Sdílet
    domain: vinted.cz
  fingerprints:
  - name: vinted_home
    version: 0.0.0
    resource_ids:
    - navigation_tab_browse
    - homepage_chips_list
    texts:
    - Domů
    - Procházej
  - name: vinted_search_results
    version: 0.0.0
    resource_ids:
    - item_grid_recycler_view
    - item_box_container
    texts: []
  - name: vinted_listing_detail
    version: 0.0.0
    resource_ids:
    - item_screen_content
    - item_summary_content
    - total_price
    texts:
    - Koupit
    - Nabídnout cenu
media:
  max_photos: null
  min_width: null
  min_height: null
  max_width: null
  max_height: null
  aspect_preferred: null
  max_file_bytes: null
  formats: []
  source_url: null
  verified_at: null
