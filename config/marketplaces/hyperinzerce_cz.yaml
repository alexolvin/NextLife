key: hyperinzerce_cz
title: Hyperinzerce.cz
country: CZ
lang: cs
currency: CZK
access_mode: DIRECT
search_mode: html
base_url: "https://hyperinzerce.cz"
canary_query: "notebook"
auth:
  type: none
  secret_ref: ""
rate_limits:
  requests_per_minute: 20
  min_delay_seconds: 2
capabilities:
  search: true
  post: true
  edit: true
  archive: true
  relist: true
  category_auto_detect: true
  has_delivery_fields: false
  max_photos: 10
  max_title_len: 60
  max_body_len: 4000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
    - zasilkovna
    - courier
  payment_options:
    - cash
    - bank_transfer
    - cod
selectors:
  search_result: ".c-ad-list__item"
  price: ".c-ad-list__item-price"
  title: "a.c-ad-list__item-name"
routes:
  search: "/inzeraty/Index"
  search_params:
    query: "query"
    min_price: "PriceFrom"
    max_price: "PriceTo"
