key: hyperinzerce_cz
title: Hyperinzerce.cz
country: CZ
currency: CZK
access_mode: DIRECT
base_url: "https://hyperinzerce.cz"
# D.1 daily canary: harmless query.
canary_query: "notebook"
auth:
  type: none
  secret_ref: ""
capabilities:
  search: true
  # Ч-5/Ч-6 (TZ M1 A.4): публикация не реализована — нужна учётная запись
  # Владельца на Hyperinzerce (форма подачи на сайте). До этого capabilities
  # обязаны отражать реальность. Лимиты max_* — консервативные, верифицировать
  # при подключении формы подачи.
  post: false
  edit: false
  archive: false
  messaging: false
  max_photos: 10
  max_title_len: 60
  max_body_len: 4000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
    - zasilkovna
    - courier
  payment_options:
    - cash
    - bank_transfer
    - cod
selectors:
  # Live markup 2026-10-04 (.a/reports/m1/probes/2026-10-04/
  # hyperinzerce_cz_search_notebook.html): 20 cards, price «4 444 Kč» или
  # «Dohodou» (без цены — карточка пропускается парсером). Даты на карточках
  # выдачи НЕТ (Ч-1: posted_at остаётся None).
  search_result: ".c-ad-list__item"
  price: ".c-ad-list__item-price"
  title: "a.c-ad-list__item-name"
routes:
  # Live-verified 2026-10-04: GET /inzeraty/Index?query=...; GET-параметры
  # цены PriceFrom/PriceTo проверены живой пробой (диапазон 1000-5000).
  search: "/inzeraty/Index"
  search_params:
    query: "query"
    min_price: "PriceFrom"
    max_price: "PriceTo"
mapping:
  category_map:
    electronics: "pocitace-a-hry"
  condition_map:
    used: "použité"
  delivery_map:
    pickup: "Osobní předání"
    post: "Pošta / balík"
    zasilkovna: "Zásilkovna"
    courier: "Kuryr"
  payment_map:
    cash: "Hotově"
    bank_transfer: "Bankovní převod"
    cod: "Dobírka"
rate_limits:
  requests_per_minute: 20
  min_delay_seconds: 2

media:
  max_photos: null
  min_width: null
  min_height: null
  max_width: null
  max_height: null
  aspect_preferred: null
  max_file_bytes: null
  formats: []
  source_url: null
  verified_at: null
