key: annonce_cz
title: Annonce.cz
country: CZ
lang: cs
currency: CZK
access_mode: DIRECT
search_mode: html
base_url: "https://www.annonce.cz"
canary_query: "notebook"
auth:
  type: none
  secret_ref: ""
rate_limits:
  requests_per_minute: 20
  min_delay_seconds: 2
capabilities:
  search: true
  post: true
  edit: true
  archive: true
  relist: true
  category_auto_detect: true
  has_delivery_fields: false
  max_photos: 10
  max_title_len: 60
  max_body_len: 4000
  allows_generative_photos: false
  delivery_options:
    - pickup
    - post
    - zasilkovna
    - courier
  payment_options:
    - cash
    - bank_transfer
    - cod
selectors:
  search_result: ".ext-item"
  price: "strong.mini-sticker"
  title: "h2 a.clickable"
  date: ".ad-date"
routes:
  search: "/vsechny-inzeraty$18-filter.html"
  search_params:
    query: "q"
    min_price: "price_from"
    max_price: "price_to"
category_tree:
  - top: pocitace
    label: "Počítače a software"
    subs:
      - "Notebooky, netbooky"
      - "PC sestavy"
      - "Herní konzole"
      - "Tablety a čtečky"
