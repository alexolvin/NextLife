legal_disclaimer:
  title: "Upozornění a právní doložka k soukromému prodeji"
  paragraphs:
    - "Jedná se o soukromý prodej použitého zboží od nepodnikající fyzické osoby."
    - "V souladu s § 1916 občanského zákoníku se vylučuje odpovědnost za vady nad rámec popsaného stavu."
    - "Kupující nemá právo na odstoupení od smlouvy do 14 dnů bez udání důvodu (nejedná se o nákup od podnikatele)."
    - "Osobní vyzkoušení a zevrubná prohlídka při převzetí v Praze jsou vítány."
