{% extends "base.html" %}

{% block content %}
<div class="stock-new-page">
  <div class="page-head">
    <h1 class="page-title">Новый предмет</h1>
  </div>

  {% if notice == 'created_next' %}
    <div class="alert alert-success">
      ✓ Предмет <a href="/ui/stock/{{ created_code }}">#{{ created_code }}</a> успешно создан! Введите следующий:
    </div>
  {% endif %}

  <form method="post" action="/api/stock" id="stock-new-form" class="card stack-md" data-testid="stock-form">
    <div class="form-group">
      <label for="input-title" class="label">Название предмета *</label>
      <input type="text" id="input-title" name="title" required autofocus placeholder="Например, Клавиатура Apple Magic Keyboard"
             class="input" data-testid="input-stock-title" data-testid="stock-title">
    </div>

    <div class="form-group">
      <label for="input-location" class="label">📍 Место на складе</label>
      <input type="text" id="input-location" name="storage_location" value="{{ location }}" placeholder="Например, Полка A-3"
             class="input" data-testid="input-stock-location">
      <div id="recent-locations-container" class="recent-locations-chips"></div>
    </div>

    <div class="split-row">
      <button type="submit" name="action" value="create" class="btn btn-primary" data-testid="btn-create-submit">
        Создать
      </button>
      <button type="submit" name="action" value="create_and_next" class="btn btn-secondary" data-testid="btn-create-and-next">
        Создать и следующий
      </button>
    </div>
  </form>
</div>

<script>
  (function() {
    const locInput = document.getElementById('input-location');
    const container = document.getElementById('recent-locations-container');
    if (!locInput) return;

    let recents = [];
    try {
      recents = JSON.parse(localStorage.getItem('stock_recent_locations') || '[]');
    } catch (e) {}

    if (!locInput.value && recents.length > 0) {
      locInput.value = recents[0];
    }

    if (container && recents.length > 0) {
      recents.slice(0, 4).forEach(function(loc) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip chip-sm';
        btn.textContent = '📍 ' + loc;
        btn.addEventListener('click', function() {
          locInput.value = loc;
        });
        container.appendChild(btn);
      });
    }

    const form = document.getElementById('stock-new-form');
    if (form) {
      form.addEventListener('submit', function() {
        const val = (locInput.value || '').trim();
        if (val) {
          recents = [val].concat(recents.filter(function(x) { return x !== val; })).slice(0, 8);
          try {
            localStorage.setItem('stock_recent_locations', JSON.stringify(recents));
            localStorage.setItem('last_stock_location', val);
          } catch (e) {}
        }
      });
    }
  })();
</script>
{% endblock %}
