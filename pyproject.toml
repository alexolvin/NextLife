[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextlife"
version = "2026.11.81"
description = "OpenClaw skill for buying and selling second-hand goods"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NextLife Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "jinja2>=3.1.3",
    "pillow>=10.2.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "curl_cffi>=0.7.0",
    "qrcode>=8.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber==0.11.10",
    "playwright==1.63.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
    "types-psycopg2>=2.9.21.20240318"
]

[project.scripts]
nextlife = "nextlife.cli.main:entrypoint"
nextlife-api = "nextlife.api.main:main"
nextlife-worker = "nextlife.jobs.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP"
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "pdfplumber",
    "curl_cffi.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
